networks:

  # No internet - only for internal container communication
  ai_intern:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24   # static internal subnet

  # Only host communication: Container -> Ollama on host
  #    internal is set to false, so host-gateway is accessible
  ai_host:
    internal: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ai-host  # Network name permanently assigned
    ipam:
      config:
        - subnet: 172.30.0.0/24   # Static subnet – see UFW rule

  # With Internet: only when needed for OpenWebUI Init / N8n Webhooks
  # Simply remove or add the network from the networks entries as needed
  ai_extern:
    internal: false


services:

  # LiteLLM Proxy 
  # Normalizes Tool Calls (e.g. Qwen3, Llama) to OpenAI format.
  # Claude Code: export ANTHROPIC_BASE_URL=http://localhost:4000
  #              export ANTHROPIC_AUTH_TOKEN=sk-local-litellm
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      - ai_intern   # OpenWebUI + n8n reach LiteLLM via http://litellm:4000
      - ai_host     # LiteLLM -> Ollama on host
    ports:
      - "127.0.0.1:4000:4000"   # accessible from host only (for Claude Code CLI)
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=sk-local-litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Chat-Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai_intern   # internal container communication
      - ai_host     # for host-gateway -> Ollama
      # The first time you launch the application to download embedded models (e.g., Whisper):
      # - ai_extern
    ports:
      - "3000:8080"   # accessible only from the host
    volumes:
      - webui_daten:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resolves to the host IP
    environment:
      # Ollama-connection
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_ENGINE=ollama

      # Privacy
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=1
      - ANONYMIZED_TELEMETRY=false

      # CORS
      - CORS_ALLOW_ORIGIN=http://localhost:3000
      - WEBUI_URL=http://localhost:3000

      # Offline Mode (no HuggingFace etc.), comment this out on first run if necessary!
      - OFFLINE_MODE=true
      - HF_DATASETS_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1

      # Optional: disable automatic updates (not actually necessary if ai_extern is not connected)
      # - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      # - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      # - WHISPER_MODEL_AUTO_UPDATE=false


  # ─── Workflow-Automatisierung ─────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    networks:
      - ai_intern   # internal communicaiton with OpenWebUI
      - ai_host     # for host-gateway → Ollama
      # For external webhooks / APIs:
      # - ai_extern
    ports:
      - "127.0.0.1:5678:5678"   # accessible only from the host
    volumes:
      - n8n_daten:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # privacy / no cloud-connection
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false

      # You can connect to Ollama in n8n via the following URL:
      #    Base URL: http://host.docker.internal:11434


volumes:
  webui_daten:
  n8n_daten:
