networks:

  # Kein Internet: für interne Container-Kommunikation
  ai_intern:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24   # Festes internes Subnetz

  # Nur Host-Kommunikation: Container -> Ollama auf dem Host
  #    internal: false damit host-gateway erreichbar ist
  ai_host:
    internal: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ai-host  # Netzwerkname fest zugewiesen
    ipam:
      config:
        - subnet: 172.30.0.0/24   # Festes Subnetz – siehe UFW Regel

  # Mit Internet: nur bei Bedarf für OpenWebUI Init / N8n Webhooks
  # Netzwerk einfach nach Bedarf aus den networks-Einträgen entfernen oder hinzufügen
  ai_extern:
    internal: false


services:

  # Chat-Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai_intern   # interne Kommunikation
      - ai_host     # für host-gateway -> Ollama
      # Beim ersten Start zum Herunterladen eingebetteter Modelle (z.B. Whisper):
      # - ai_extern
    ports:
      - "127.0.0.1:3000:8080"   # nur vom Host aus erreichbar
    volumes:
      - webui_daten:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # löst zur Host-IP auf
    environment:
      # Ollama-Verbindung
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_ENGINE=ollama

      # Datenschutz
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=1
      - ANONYMIZED_TELEMETRY=false

      # CORS
      - CORS_ALLOW_ORIGIN=http://localhost:3000
      - WEBUI_URL=http://localhost:3000

      # Offline-Modus (kein HuggingFace etc.), ggf. bei erstem Start auskommentieren!
      - OFFLINE_MODE=true
      - HF_DATASETS_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1

      # Optional: Auto-Updates deaktivieren (eigentl. nicht erforderlich, wenn ai_extern nicht verbunden)
      # - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      # - RAG_RERANKING_MODEL_AUTO_UPDATE=false
      # - WHISPER_MODEL_AUTO_UPDATE=false


  # ─── Workflow-Automatisierung ─────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    networks:
      - ai_intern   # interne Kommunikation mit Open WebUI
      - ai_host     # für host-gateway → Ollama
      # Für externe Webhooks / APIs:
      # - ai_extern
    ports:
      - "127.0.0.1:5678:5678"   # nur vom Host aus erreichbar
    volumes:
      - n8n_daten:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Datenschutz / keine Cloud-Verbindungen
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false

      # Ollama-Verbindung in n8n über folgende URL möglich:
      #    Base URL: http://host.docker.internal:11434


volumes:
  webui_daten:
  n8n_daten:
